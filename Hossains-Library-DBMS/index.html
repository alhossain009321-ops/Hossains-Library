<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hossains Library - DBMS Lab Project</title>
  <!-- SQLite WebAssembly Engine (Runs real SQL in the browser with zero server setup) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
  <style>
    :root {
      --bg-body: #0b101b;
      --bg-card: #131a29;
      --bg-input: #0e1420;
      --bg-table-head: #161f30;
      --bg-row-hover: #182236;
      --border-subtle: #1f2a40;
      --border-input: #25334d;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-blue: #2563eb;
      --accent-blue-hover: #1d4ed8;
      --accent-blue-light: #3b82f6;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 28px 20px 60px;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .badge-project {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #ffffff;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 7px 16px;
      border-radius: 999px;
      box-shadow: 0 0 18px rgba(37, 99, 235, 0.45);
      cursor: pointer;
      border: none;
      transition: transform 0.15s ease;
    }

    .badge-project:hover {
      transform: translateY(-1px);
    }

    /* Summary Cards */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 24px;
    }

    .summary-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 22px 24px;
    }

    .summary-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .summary-value {
      font-size: 2rem;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .summary-unit {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    /* Add Record Card */
    .form-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 22px 24px;
      margin-bottom: 24px;
    }

    .form-card h2 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 16px;
    }

    .add-form {
      display: grid;
      grid-template-columns: 1.3fr 1.3fr 1.1fr 0.9fr 0.8fr auto;
      gap: 12px;
      align-items: center;
    }

    input, select {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border-input);
      border-radius: 8px;
      padding: 11px 14px;
      color: var(--text-primary);
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input::placeholder {
      color: var(--text-muted);
    }

    input:focus, select:focus {
      border-color: var(--accent-blue-light);
    }

    select {
      cursor: pointer;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 11px 20px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn-primary {
      background-color: var(--accent-blue);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    .btn-primary:hover {
      background-color: var(--accent-blue-hover);
    }

    /* Search Bar */
    .search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      max-width: 540px;
    }

    .btn-search {
      background-color: #334155;
      color: #f8fafc;
      padding: 10px 20px;
    }

    .btn-search:hover {
      background-color: #475569;
    }

    .btn-reset {
      background-color: #161f30;
      color: var(--text-secondary);
      border: 1px solid var(--border-input);
      padding: 10px 18px;
    }

    .btn-reset:hover {
      color: #ffffff;
      border-color: #475569;
    }

    /* Data Table */
    .table-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    thead {
      background-color: var(--bg-table-head);
      border-bottom: 1px solid var(--border-subtle);
    }

    th {
      padding: 15px 20px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
    }

    td {
      padding: 16px 20px;
      font-size: 0.9rem;
      border-bottom: 1px solid var(--border-subtle);
      vertical-align: middle;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background-color: var(--bg-row-hover);
    }

    .col-id {
      color: var(--text-muted);
      font-weight: 500;
    }

    .col-title {
      font-weight: 600;
      color: #ffffff;
    }

    .col-author {
      color: #cbd5e1;
    }

    .category-pill {
      display: inline-block;
      padding: 4px 12px;
      font-size: 0.78rem;
      font-weight: 500;
      color: #60a5fa;
      background-color: rgba(37, 99, 235, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-radius: 999px;
    }

    .col-price {
      color: var(--accent-green);
      font-weight: 600;
    }

    .col-stock {
      color: #e2e8f0;
    }

    .action-group {
      display: flex;
      gap: 8px;
    }

    .btn-edit {
      background-color: rgba(245, 158, 11, 0.1);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.35);
      padding: 5px 12px;
      font-size: 0.78rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-edit:hover {
      background-color: rgba(245, 158, 11, 0.2);
    }

    .btn-delete {
      background-color: rgba(239, 68, 68, 0.1);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.35);
      padding: 5px 12px;
      font-size: 0.78rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-delete:hover {
      background-color: rgba(239, 68, 68, 0.2);
    }

    .empty-state {
      text-align: center;
      padding: 36px;
      color: var(--text-muted);
    }

    /* Modal for Edit & SQL Inspector */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 15, 0.78);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border-input);
      border-radius: 14px;
      width: 100%;
      max-width: 460px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .modal-header h3 {
      font-size: 1.1rem;
      color: #ffffff;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.3rem;
      cursor: pointer;
    }

    .modal-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-form label {
      display: block;
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 8px;
    }

    .sql-log-box {
      background: #090d16;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.78rem;
      color: #38bdf8;
      max-height: 240px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    @media (max-width: 900px) {
      .summary-grid {
        grid-template-columns: 1fr;
      }
      .add-form {
        grid-template-columns: 1fr;
      }
      .search-bar {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Top Header -->
    <header class="header">
      <h1>Hossains Library</h1>
      <button class="badge-project" id="openSqlModalBtn" title="Click to inspect live SQL queries or reset DB">
        DBMS Lab Project
      </button>
    </header>

    <!-- Summary Cards (SQL Aggregate Functions: COUNT, SUM, AVG) -->
    <section class="summary-grid">
      <div class="summary-card">
        <div class="summary-label">Total Titles</div>
        <div class="summary-value" id="statTotalTitles">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Inventory Stock</div>
        <div class="summary-value">
          <span id="statTotalStock">0</span>
          <span class="summary-unit">units</span>
        </div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Average Price</div>
        <div class="summary-value">
          <span id="statAvgPrice">0.00</span>
          <span class="summary-unit">BDT</span>
        </div>
      </div>
    </section>

    <!-- Add New Record Form (SQL INSERT) -->
    <section class="form-card">
      <h2>Add New Record</h2>
      <form class="add-form" id="addBookForm">
        <input type="text" id="bookTitle" placeholder="Book Title" required />
        <input type="text" id="bookAuthor" placeholder="Author Name" required />
        <select id="bookCategory" required>
          <option value="" disabled selected>Select Category</option>
        </select>
        <input type="number" id="bookPrice" placeholder="Price (BDT)" min="0" step="0.01" required />
        <input type="number" id="bookStock" placeholder="Stock Qty" min="0" step="1" required />
        <button type="submit" class="btn btn-primary">Add Book</button>
      </form>
    </section>

    <!-- Search & Filter Bar (SQL SELECT ... WHERE ... LIKE) -->
    <section class="search-bar">
      <input type="text" id="searchInput" placeholder="Search title, author, or category..." />
      <button type="button" class="btn btn-search" id="searchBtn">Search</button>
      <button type="button" class="btn btn-reset" id="resetBtn">Reset</button>
    </section>

    <!-- Records Table (SQL SELECT with INNER JOIN) -->
    <section class="table-card">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="booksTableBody"></tbody>
      </table>
    </section>
  </div>

  <!-- Edit Book Modal (SQL UPDATE) -->
  <div class="modal-backdrop" id="editModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Edit Book Record</h3>
        <button class="modal-close" id="closeEditModal">&times;</button>
      </div>
      <form class="modal-form" id="editBookForm">
        <input type="hidden" id="editBookId" />
        <div>
          <label for="editTitle">Book Title</label>
          <input type="text" id="editTitle" required />
        </div>
        <div>
          <label for="editAuthor">Author Name</label>
          <input type="text" id="editAuthor" required />
        </div>
        <div>
          <label for="editCategory">Category</label>
          <select id="editCategory" required></select>
        </div>
        <div>
          <label for="editPrice">Price (BDT)</label>
          <input type="number" id="editPrice" min="0" step="0.01" required />
        </div>
        <div>
          <label for="editStock">Stock Qty</label>
          <input type="number" id="editStock" min="0" step="1" required />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-reset" id="cancelEditBtn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SQL Query Log & Reset Modal (Helpful for Lab Viva / Demonstration) -->
  <div class="modal-backdrop" id="sqlModal">
    <div class="modal-box" style="max-width: 580px;">
      <div class="modal-header">
        <h3>Executed SQL Queries (SQLite Engine)</h3>
        <button class="modal-close" id="closeSqlModal">&times;</button>
      </div>
      <p style="font-size: 0.82rem; color: var(--text-secondary); margin-bottom: 12px;">
        Relational tables: <strong>categories</strong> (Primary Key) &rarr; <strong>books</strong> (Primary Key + Foreign Key).
      </p>
      <div class="sql-log-box" id="sqlLogOutput"></div>
      <div class="modal-actions" style="margin-top: 14px;">
        <button type="button" class="btn btn-delete" id="resetDatabaseBtn">Reset Sample Data</button>
        <button type="button" class="btn btn-primary" id="doneSqlModalBtn">Close</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'hossains_library_sqlite_v1';
    let db = null;
    const executedQueries = [];

    function logSQL(query) {
      const timestamp = new Date().toLocaleTimeString();
      executedQueries.unshift(`[${timestamp}] ${query.trim()}`);
      if (executedQueries.length > 25) executedQueries.pop();
    }

    // Persist SQLite binary database in localStorage so changes survive page refresh
    function saveDatabase() {
      const binaryArray = db.export();
      let binaryString = '';
      for (let i = 0; i < binaryArray.length; i++) {
        binaryString += String.fromCharCode(binaryArray[i]);
      }
      localStorage.setItem(STORAGE_KEY, btoa(binaryString));
    }

    function loadSavedDatabase(SQL) {
      const savedBase64 = localStorage.getItem(STORAGE_KEY);
      if (!savedBase64) return null;
      const binaryString = atob(savedBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return new SQL.Database(bytes);
    }

    // Initialize Relational Schema & Seed 10 Sample Records
    function seedDatabase() {
      db.run('PRAGMA foreign_keys = ON;');

      const createCategoriesSQL = `
        CREATE TABLE categories (
          category_id INTEGER PRIMARY KEY AUTOINCREMENT,
          category_name VARCHAR(100) NOT NULL UNIQUE
        );
      `;
      const createBooksSQL = `
        CREATE TABLE books (
          book_id INTEGER PRIMARY KEY AUTOINCREMENT,
          title VARCHAR(200) NOT NULL,
          author VARCHAR(150) NOT NULL,
          category_id INTEGER NOT NULL,
          price DECIMAL(10, 2) NOT NULL CHECK (price >= 0),
          stock INTEGER NOT NULL CHECK (stock >= 0),
          FOREIGN KEY (category_id) REFERENCES categories(category_id)
            ON UPDATE CASCADE
            ON DELETE RESTRICT
        );
      `;

      db.run(createCategoriesSQL);
      db.run(createBooksSQL);
      logSQL(createCategoriesSQL);
      logSQL(createBooksSQL);

      const categories = [
        'Computer Science',
        'Mathematics',
        'Literature',
        'Physics',
        'Engineering',
        'History'
      ];
      categories.forEach((cat) => {
        db.run('INSERT INTO categories (category_name) VALUES (?);', [cat]);
      });
      logSQL("INSERT INTO categories (category_name) VALUES ('Computer Science'), ('Mathematics'), ...;");

      // 10 Sample Books matching the project dashboard stats (10 titles, 137 units, 779.00 BDT avg)
      const sampleBooks = [
        ['Database System Concepts', 'Abraham Silberschatz', 1, 850.00, 12],
        ['Introduction to Algorithms', 'Thomas H. Cormen', 1, 1200.00, 8],
        ['Clean Code', 'Robert C. Martin', 1, 950.00, 15],
        ['Linear Algebra Done Right', 'Sheldon Axler', 2, 700.00, 10],
        ['Calculus', 'James Stewart', 2, 1100.00, 6],
        ['To Kill a Mockingbird', 'Harper Lee', 3, 450.00, 20],
        ['1984', 'George Orwell', 3, 400.00, 25],
        ['The Great Gatsby', 'F. Scott Fitzgerald', 3, 390.00, 18],
        ['Concepts of Physics', 'H.C. Verma', 4, 850.00, 14],
        ['University Physics', 'Hugh D. Young', 4, 900.00, 9]
      ];

      sampleBooks.forEach((b) => {
        db.run(
          'INSERT INTO books (title, author, category_id, price, stock) VALUES (?, ?, ?, ?, ?);',
          b
        );
      });
      logSQL('INSERT INTO books (title, author, category_id, price, stock) VALUES (...10 records...);');
      saveDatabase();
    }

    function populateCategoryDropdowns() {
      const res = db.exec('SELECT category_id, category_name FROM categories ORDER BY category_id ASC;');
      const addSelect = document.getElementById('bookCategory');
      const editSelect = document.getElementById('editCategory');

      addSelect.innerHTML = '<option value="" disabled selected>Select Category</option>';
      editSelect.innerHTML = '';

      if (res.length > 0) {
        res[0].values.forEach(([id, name]) => {
          addSelect.innerHTML += `<option value="${id}">${name}</option>`;
          editSelect.innerHTML += `<option value="${id}">${name}</option>`;
        });
      }
    }

    // Update Summary Cards using SQL Aggregate Functions: COUNT(), SUM(), AVG()
    function updateSummaryCards() {
      const aggSQL = `
        SELECT
          COUNT(book_id) AS total_titles,
          COALESCE(SUM(stock), 0) AS total_stock,
          COALESCE(AVG(price), 0) AS avg_price
        FROM books;
      `;
      const res = db.exec(aggSQL);
      logSQL(aggSQL);

      if (res.length > 0) {
        const [totalTitles, totalStock, avgPrice] = res[0].values[0];
        document.getElementById('statTotalTitles').textContent = totalTitles;
        document.getElementById('statTotalStock').textContent = totalStock;
        document.getElementById('statAvgPrice').textContent = Number(avgPrice).toLocaleString('en-US', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
      }
    }

    // Render Records using SQL SELECT + INNER JOIN + WHERE Filtering
    function renderBooksTable(searchTerm = '') {
      const tbody = document.getElementById('booksTableBody');
      const trimmed = searchTerm.trim();

      let querySQL = `
        SELECT
          b.book_id,
          b.title,
          b.author,
          c.category_id,
          c.category_name,
          b.price,
          b.stock
        FROM books b
        INNER JOIN categories c ON b.category_id = c.category_id
      `;

      const params = [];
      if (trimmed !== '') {
        querySQL += ` WHERE b.title LIKE ? OR b.author LIKE ? OR c.category_name LIKE ? `;
        const likePattern = `%${trimmed}%`;
        params.push(likePattern, likePattern, likePattern);
      }
      querySQL += ` ORDER BY b.book_id ASC;`;

      const stmt = db.prepare(querySQL);
      if (params.length > 0) stmt.bind(params);

      const rows = [];
      while (stmt.step()) {
        rows.push(stmt.getAsObject());
      }
      stmt.free();
      logSQL(trimmed ? `${querySQL} -- param: '%${trimmed}%'` : querySQL);

      if (rows.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="empty-state">No matching book records found in the database.</td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = rows
        .map((row) => {
          const formattedPrice = Number(row.price).toLocaleString('en-US', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          });
          return `
            <tr>
              <td class="col-id">#${row.book_id}</td>
              <td class="col-title">${escapeHTML(row.title)}</td>
              <td class="col-author">${escapeHTML(row.author)}</td>
              <td><span class="category-pill">${escapeHTML(row.category_name)}</span></td>
              <td class="col-price">${formattedPrice} BDT</td>
              <td class="col-stock">${row.stock}</td>
              <td>
                <div class="action-group">
                  <button class="btn-edit" onclick="openEditModal(${row.book_id})">Edit</button>
                  <button class="btn-delete" onclick="deleteBook(${row.book_id}, '${escapeAttr(row.title)}')">Delete</button>
                </div>
              </td>
            </tr>
          `;
        })
        .join('');
    }

    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeAttr(str) {
      return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // Add New Record (SQL INSERT)
    document.getElementById('addBookForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('bookTitle').value.trim();
      const author = document.getElementById('bookAuthor').value.trim();
      const categoryId = parseInt(document.getElementById('bookCategory').value, 10);
      const price = parseFloat(document.getElementById('bookPrice').value);
      const stock = parseInt(document.getElementById('bookStock').value, 10);

      const insertSQL = `INSERT INTO books (title, author, category_id, price, stock) VALUES (?, ?, ?, ?, ?);`;
      db.run(insertSQL, [title, author, categoryId, price, stock]);
      logSQL(`INSERT INTO books (title, author, category_id, price, stock) VALUES ('${title}', '${author}', ${categoryId}, ${price}, ${stock});`);

      saveDatabase();
      e.target.reset();
      document.getElementById('searchInput').value = '';
      renderBooksTable();
      updateSummaryCards();
    });

    // Search & Reset Handlers
    document.getElementById('searchBtn').addEventListener('click', () => {
      renderBooksTable(document.getElementById('searchInput').value);
    });

    document.getElementById('searchInput').addEventListener('keyup', (e) => {
      if (e.key === 'Enter') {
        renderBooksTable(e.target.value);
      }
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      document.getElementById('searchInput').value = '';
      renderBooksTable();
    });

    // Edit Record Modal (SQL SELECT by PK & SQL UPDATE)
    window.openEditModal = function (bookId) {
      const stmt = db.prepare('SELECT * FROM books WHERE book_id = ?;');
      stmt.bind([bookId]);
      if (stmt.step()) {
        const book = stmt.getAsObject();
        document.getElementById('editBookId').value = book.book_id;
        document.getElementById('editTitle').value = book.title;
        document.getElementById('editAuthor').value = book.author;
        document.getElementById('editCategory').value = book.category_id;
        document.getElementById('editPrice').value = book.price;
        document.getElementById('editStock').value = book.stock;
        document.getElementById('editModal').classList.add('active');
      }
      stmt.free();
    };

    function closeEditModal() {
      document.getElementById('editModal').classList.remove('active');
    }

    document.getElementById('closeEditModal').addEventListener('click', closeEditModal);
    document.getElementById('cancelEditBtn').addEventListener('click', closeEditModal);

    document.getElementById('editBookForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const bookId = parseInt(document.getElementById('editBookId').value, 10);
      const title = document.getElementById('editTitle').value.trim();
      const author = document.getElementById('editAuthor').value.trim();
      const categoryId = parseInt(document.getElementById('editCategory').value, 10);
      const price = parseFloat(document.getElementById('editPrice').value);
      const stock = parseInt(document.getElementById('editStock').value, 10);

      const updateSQL = `
        UPDATE books
        SET title = ?, author = ?, category_id = ?, price = ?, stock = ?
        WHERE book_id = ?;
      `;
      db.run(updateSQL, [title, author, categoryId, price, stock, bookId]);
      logSQL(`UPDATE books SET title='${title}', author='${author}', category_id=${categoryId}, price=${price}, stock=${stock} WHERE book_id=${bookId};`);

      saveDatabase();
      closeEditModal();
      renderBooksTable(document.getElementById('searchInput').value);
      updateSummaryCards();
    });

    // Delete Record with Confirmation (SQL DELETE)
    window.deleteBook = function (bookId, bookTitle) {
      if (!confirm(`Are you sure you want to delete "${bookTitle}" (ID #${bookId})?`)) {
        return;
      }
      const deleteSQL = 'DELETE FROM books WHERE book_id = ?;';
      db.run(deleteSQL, [bookId]);
      logSQL(`DELETE FROM books WHERE book_id = ${bookId};`);

      saveDatabase();
      renderBooksTable(document.getElementById('searchInput').value);
      updateSummaryCards();
    };

    // SQL Inspector Modal (Click "DBMS Lab Project" pill in header)
    document.getElementById('openSqlModalBtn').addEventListener('click', () => {
      document.getElementById('sqlLogOutput').textContent = executedQueries.join('\n\n');
      document.getElementById('sqlModal').classList.add('active');
    });

    document.getElementById('closeSqlModal').addEventListener('click', () => {
      document.getElementById('sqlModal').classList.remove('active');
    });

    document.getElementById('doneSqlModalBtn').addEventListener('click', () => {
      document.getElementById('sqlModal').classList.remove('active');
    });

    document.getElementById('resetDatabaseBtn').addEventListener('click', () => {
      if (confirm('Reset the database back to the original 10 sample books?')) {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
      }
    });

    // Boot SQLite WebAssembly Engine
    initSqlJs({
      locateFile: (file) => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${file}`
    }).then((SQL) => {
      db = loadSavedDatabase(SQL);
      if (!db) {
        db = new SQL.Database();
        seedDatabase();
      } else {
        db.run('PRAGMA foreign_keys = ON;');
        logSQL('-- Loaded existing SQLite database from browser storage');
      }
      populateCategoryDropdowns();
      renderBooksTable();
      updateSummaryCards();
    });
  </script>
</body>
</html>
